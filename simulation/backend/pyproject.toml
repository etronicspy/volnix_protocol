[project]
name = "volnix-simulation-backend"
version = "0.2.0"
description = "Off-chain simulation backend for Volnix Protocol"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "slow: longer integration tests",
]

[tool.coverage.run]
source = ["core"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["venv", "data", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
    "E501",
    "B008",
    "B904",
    "B007",
    "B017",
    "B018",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF013",
    "UP007",
    "UP035",
    "UP006",
    "F401",
    "E402",
    "E722",
    "RUF006",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "PT011", "PT018"]
"core/engine.py" = ["F841"]
"main.py" = ["F841"]

[tool.mypy]
python_version = "3.9"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["venv", "data", "tests"]
