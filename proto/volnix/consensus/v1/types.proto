syntax = "proto3";
package volnix.consensus.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/volnix-protocol/volnix-protocol/proto/gen/go/volnix/consensus/v1;consensusv1";

// Validator in the PoVB consensus system
message Validator {
  string validator = 1;            // bech32 account address
  string consensus_address = 2;    // CometBFT hex consensus address
  ValidatorStatus status = 3;
  google.protobuf.Timestamp last_active = 4;
  uint64 last_block_height = 5;
  string activated_lzn = 6;        // L_i — activated LZN in min units (1 LZN = 1 ANT)
  string total_burn_amount = 7;    // cumulative ANT burned
  google.protobuf.Timestamp last_burn_time = 8;  // last qualifying burn for MOA §5.3
}

enum ValidatorStatus {
  VALIDATOR_STATUS_UNSPECIFIED = 0;
  VALIDATOR_STATUS_ACTIVE = 1;
  VALIDATOR_STATUS_INACTIVE = 2;
  VALIDATOR_STATUS_SLASHED = 3;
}

// PerHeightBurn — validator's burn declaration for a single block height §5.4
message PerHeightBurn {
  string validator = 1;
  uint64 block_height = 2;
  string s_i = 3;     // priority stake (ANT min units)
  string b_i = 4;     // burn-for-fee-share (ANT min units)
  string inc_i = 5;   // actually included in F split after global cap
}

// HeightBurnSummary — aggregate burn data for a single height
message HeightBurnSummary {
  uint64 block_height = 1;
  string total_fees = 2;           // F — sum of tx fees for this height
  string total_included_burn = 3;  // B = Σ inc_i
  string global_cap = 4;           // C = λ · L_tot
  string l_tot = 5;                // total activated LZN across network
  repeated PerHeightBurn burns = 6;
}

// Params for the consensus module
message Params {
  string base_block_time = 1;           // target block interval (e.g. "5s")
  string base_block_reward = 2;         // base WRT reward per block in micro WRT
  string burn_cap_lambda = 3;           // λ ∈ [1/3, 2/3]; DAO §7.2 п.10
  string fee_policy_b_zero = 4;         // policy when B=0: "community_pool" | "carry_forward" §7.2 п.6
  uint64 halving_interval = 5;          // N blocks between halvings §6.2 (default 210000)
  // MOA penalty thresholds kept for reward distribution
  string moa_penalty_threshold_high = 6;
  string moa_penalty_threshold_warning = 7;
  string moa_penalty_threshold_medium = 8;
  string moa_penalty_threshold_low = 9;
  uint64 max_block_gas = 10;            // §7.2 п.7 — max gas per block
  uint64 max_block_bytes = 11;          // §7.2 п.8 — max block size in bytes
}

// HalvingInfo — WRT emission halving (Bitcoin model) §6.2
message HalvingInfo {
  uint64 last_halving_height = 1;
  uint64 halving_interval = 2;
  uint64 next_halving_height = 3;
  google.protobuf.Timestamp estimated_next_halving_date = 4;
  google.protobuf.Timestamp last_halving_date = 5;
}

// ConsensusState — current consensus state
message ConsensusState {
  uint64 current_height = 1;
  string total_ant_burned = 2;
  google.protobuf.Timestamp last_block_time = 3;
  repeated string active_validators = 4;
  string l_tot = 5;  // total activated LZN at this height
}

// ValidatorWeight — voting power derived from activated LZN §4.2
message ValidatorWeight {
  string validator = 1;
  string weight = 2;    // = activated LZN amount
}

// InitialValidator for genesis
message InitialValidator {
  string pub_key_type = 1;
  bytes  pub_key = 2;
  int64  power = 3;
  string account_address = 4;  // explicit mapping §4.2
}
