syntax = "proto3";

package volnix.consensus.v1;

option go_package = "github.com/volnix-protocol/volnix-protocol/proto/gen/go/volnix/consensus/v1;consensusv1";

import "volnix/consensus/v1/types.proto";

message GenesisState {
  Params params = 1;
  repeated Validator validators = 2;
  HalvingInfo halving_info = 3;
  ConsensusState consensus_state = 4;
  repeated ValidatorWeight validator_weights = 5;
  repeated InitialValidator initial_validators = 6;
}
