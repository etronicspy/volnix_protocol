syntax = "proto3";
package volnix.consensus.v1;

import "cosmos/msg/v1/msg.proto";

option go_package = "github.com/volnix-protocol/volnix-protocol/proto/gen/go/volnix/consensus/v1;consensusv1";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // DeclarePerHeightBurn — validator declares s_i and b_i for current height §5.4
  rpc DeclarePerHeightBurn(MsgDeclarePerHeightBurn) returns (MsgDeclarePerHeightBurnResponse);

  // UpdateConsensusState — authority-only state update
  rpc UpdateConsensusState(MsgUpdateConsensusState) returns (MsgUpdateConsensusStateResponse);

  // SetValidatorWeight — authority sets validator weight (from lizenz)
  rpc SetValidatorWeight(MsgSetValidatorWeight) returns (MsgSetValidatorWeightResponse);

  // RegisterConsensusMapping — register consensus_pubkey <-> account mapping §4.2
  rpc RegisterConsensusMapping(MsgRegisterConsensusMapping) returns (MsgRegisterConsensusMappingResponse);
}

// MsgDeclarePerHeightBurn — validator's burn declaration for this block §5.4
message MsgDeclarePerHeightBurn {
  option (cosmos.msg.v1.signer) = "validator";

  string validator = 1;     // bech32 account address
  string s_i = 2;           // priority stake (ANT min units)
  string b_i = 3;           // burn for fee share (ANT min units)
}

message MsgDeclarePerHeightBurnResponse {
  string inc_i = 1;         // actually included after global cap
  bool   success = 2;
}

message MsgUpdateConsensusState {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1;
  uint64 current_height = 2;
  string total_ant_burned = 3;
  repeated string active_validators = 4;
}

message MsgUpdateConsensusStateResponse {}

message MsgSetValidatorWeight {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1;
  string validator = 2;
  string weight = 3;
}

message MsgSetValidatorWeightResponse {}

// MsgRegisterConsensusMapping — §4.2 explicit consensus <-> account mapping
message MsgRegisterConsensusMapping {
  option (cosmos.msg.v1.signer) = "account_address";

  string account_address = 1;     // bech32 account address
  bytes  consensus_pubkey = 2;    // Ed25519 pubkey
}

message MsgRegisterConsensusMappingResponse {
  string consensus_address = 1;   // derived hex consensus address
  bool   success = 2;
}
