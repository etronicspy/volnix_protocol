syntax = "proto3";

package volnix.anteil.v1;

option go_package = "github.com/volnix-protocol/volnix-protocol/proto/gen/go/volnix/anteil/v1;anteilv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// Params for the anteil (internal market) module
message Params {
  string min_order_size = 1;
  string max_order_size = 2;
  string trading_fee_rate = 3;         // fee rate for matching
  google.protobuf.Duration order_expiry = 4;
  bool require_identity_verification = 5;
  string ant_denom = 6;               // "uant"
  uint32 max_open_orders = 7;
  string price_precision = 8;

  // Epoch emission §5.5 / §7.2
  google.protobuf.Duration epoch_length = 9;                // epoch duration (default: 1 week)
  string epoch_coefficient = 10;                            // current coefficient (updated per §5.5 formula)
  string epoch_coefficient_min = 11;                        // DAO lower bound (genesis 0.75) §7.2 п.5
  string epoch_coefficient_max = 12;                        // DAO upper bound (genesis 1.50) §7.2 п.5

  // Supplier ANT cap §7.2 п.4
  string supplier_epoch_ant_limit = 13;                     // max ANT a single supplier can accumulate in one epoch

  // Distribution period kept for backward compat but semantics change to epoch
  google.protobuf.Duration citizen_ant_distribution_period = 14;
}

// Order on the internal ANT/WRT market §5.2
message Order {
  string order_id = 1;
  string owner = 2;
  OrderType order_type = 3;
  OrderSide order_side = 4;
  string ant_amount = 5;
  string price = 6;              // WRT per ANT
  OrderStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  string identity_hash = 10;
  string filled_amount = 11;
  string remaining_amount = 12;
  string escrowed_amount = 13;   // ANT (sell) or WRT (buy) locked in escrow
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;     // Validator buys ANT with WRT
  ORDER_SIDE_SELL = 2;    // Supplier sells ANT for WRT
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_OPEN = 1;
  ORDER_STATUS_PARTIALLY_FILLED = 2;
  ORDER_STATUS_FILLED = 3;
  ORDER_STATUS_CANCELLED = 4;
  ORDER_STATUS_EXPIRED = 5;
}

// Trade — completed trade on internal market
message Trade {
  string trade_id = 1;
  string buy_order_id = 2;
  string sell_order_id = 3;
  string buyer = 4;
  string seller = 5;
  string ant_amount = 6;
  string wrt_amount = 7;         // WRT settlement amount
  string price = 8;
  google.protobuf.Timestamp executed_at = 9;
  string trading_fee = 10;
}

// OrderBook — aggregate view
message OrderBook {
  repeated OrderBookEntry buy_orders = 1;
  repeated OrderBookEntry sell_orders = 2;
  string last_price = 3;
  string volume_24h = 4;
  uint64 total_orders = 5;
}

message OrderBookEntry {
  string price = 1;
  string total_amount = 2;
  uint64 order_count = 3;
}

// UserPosition — user's ANT accounting
message UserPosition {
  string owner = 1;
  string ant_balance = 2;         // free ANT balance
  string locked_ant = 3;          // ANT escrowed in open sell orders
  string available_ant = 4;       // = ant_balance - locked_ant
  repeated string open_order_ids = 5;
  string total_trades = 6;
  google.protobuf.Timestamp last_activity = 7;
  google.protobuf.Timestamp last_sell_order_time = 8;  // for MOA Supplier tracking §5.3
}

// EpochState — state of the current ANT emission epoch §5.5
message EpochState {
  uint64 epoch_number = 1;
  google.protobuf.Timestamp epoch_start = 2;
  google.protobuf.Timestamp epoch_end = 3;
  string total_burned_prev_epoch = 4;     // total ANT burned by validators in previous epoch
  string total_burned_current_epoch = 5;  // running total for current epoch
  string emission_coefficient = 6;        // current epoch coefficient
  string total_emitted = 7;              // total ANT emitted this epoch
  uint64 active_suppliers = 8;           // number of active suppliers at emission time
}
