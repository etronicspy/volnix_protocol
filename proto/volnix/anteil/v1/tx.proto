syntax = "proto3";
package volnix.anteil.v1;

option go_package = "github.com/volnix-protocol/volnix-protocol/proto/gen/go/volnix/anteil/v1;anteilv1";
import "cosmos/msg/v1/msg.proto";
import "volnix/anteil/v1/types.proto";

// Msg service for the internal market module
service Msg {
  option (cosmos.msg.v1.service) = true;

  // PlaceOrder — place a limit or market order on the internal ANT/WRT market §5.2
  rpc PlaceOrder(MsgPlaceOrder) returns (MsgPlaceOrderResponse);

  // CancelOrder — cancel an open order (releases escrow)
  rpc CancelOrder(MsgCancelOrder) returns (MsgCancelOrderResponse);

  // UpdateOrder — update price/amount of an open order
  rpc UpdateOrder(MsgUpdateOrder) returns (MsgUpdateOrderResponse);
}

message MsgPlaceOrder {
  option (cosmos.msg.v1.signer) = "owner";

  string owner = 1;
  OrderType order_type = 2;
  OrderSide order_side = 3;
  string ant_amount = 4;
  string price = 5;           // WRT per ANT (required for limit)
  string identity_hash = 6;
}

message MsgPlaceOrderResponse {
  bool success = 1;
  string order_id = 2;
  string status = 3;
}

message MsgCancelOrder {
  option (cosmos.msg.v1.signer) = "owner";

  string owner = 1;
  string order_id = 2;
}

message MsgCancelOrderResponse {
  bool success = 1;
  string status = 2;
}

message MsgUpdateOrder {
  option (cosmos.msg.v1.signer) = "owner";

  string owner = 1;
  string order_id = 2;
  string new_price = 3;
  string new_amount = 4;
}

message MsgUpdateOrderResponse {
  bool success = 1;
  string status = 2;
}
