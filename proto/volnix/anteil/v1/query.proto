syntax = "proto3";

package volnix.anteil.v1;

option go_package = "github.com/volnix-protocol/volnix-protocol/proto/gen/go/volnix/anteil/v1;anteilv1";

import "cosmos/base/query/v1beta1/pagination.proto";
import "volnix/anteil/v1/types.proto";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
  rpc Order(QueryOrderRequest) returns (QueryOrderResponse);
  rpc Orders(QueryOrdersRequest) returns (QueryOrdersResponse);
  rpc OrderBook(QueryOrderBookRequest) returns (QueryOrderBookResponse);
  rpc UserPosition(QueryUserPositionRequest) returns (QueryUserPositionResponse);
  rpc Trades(QueryTradesRequest) returns (QueryTradesResponse);
  rpc EpochState(QueryEpochStateRequest) returns (QueryEpochStateResponse);
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1; }

message QueryOrderRequest { string order_id = 1; }
message QueryOrderResponse { Order order = 1; }

message QueryOrdersRequest {
  string owner = 1;
  OrderStatus status = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryOrdersResponse {
  repeated Order orders = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOrderBookRequest {}
message QueryOrderBookResponse { OrderBook order_book = 1; }

message QueryUserPositionRequest { string owner = 1; }
message QueryUserPositionResponse { UserPosition position = 1; }

message QueryTradesRequest { cosmos.base.query.v1beta1.PageRequest pagination = 1; }
message QueryTradesResponse {
  repeated Trade trades = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryEpochStateRequest {}
message QueryEpochStateResponse { EpochState epoch_state = 1; }
