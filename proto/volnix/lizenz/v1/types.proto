syntax = "proto3";

package volnix.lizenz.v1;

option go_package = "github.com/volnix-protocol/volnix-protocol/proto/gen/go/volnix/lizenz/v1;lizenzv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// Params for the lizenz (LZN license) module
message Params {
  uint32 max_activated_per_validator = 1;   // kept for compat
  string activity_coefficient = 2;

  // Freeze period §4.1 / §7.2 п.1 — duration activated LZN stays locked
  google.protobuf.Duration activation_freeze_period = 3;

  // Deactivation / inactivity
  google.protobuf.Duration deactivation_period = 4;
  google.protobuf.Duration inactivity_period = 5;

  string min_lzn_amount = 6;
  string max_lzn_amount = 7;
  bool require_identity_verification = 8;
  string lzn_denom = 9;                   // "ulzn"

  bool consensus_integration_enabled = 10;
  bool ident_verification_required = 11;
}

// ActivatedLizenz — activated LZN license for a validator §4.1
message ActivatedLizenz {
  string validator = 1;                            // bech32 account address
  string amount = 2;                               // activated LZN amount in min units
  google.protobuf.Timestamp activation_time = 3;
  google.protobuf.Timestamp freeze_until = 4;      // activation_time + activation_freeze_period
  google.protobuf.Timestamp last_activity = 5;
  string identity_hash = 6;
  bool is_eligible_for_rewards = 7;

  // Reward tracking
  string total_rewards_earned = 8;
  string last_reward_block = 9;
  google.protobuf.Timestamp last_reward_time = 10;
}

// DeactivatingLizenz — LZN in process of deactivation
message DeactivatingLizenz {
  string validator = 1;
  string amount = 2;
  google.protobuf.Timestamp deactivation_start = 3;
  google.protobuf.Timestamp deactivation_end = 4;
  string reason = 5;
}

// MOAStatus — Minimum Obligation of Activity status for a validator §5.3
message MOAStatus {
  string validator = 1;
  bool is_active = 2;
  google.protobuf.Timestamp last_activity = 3;
  google.protobuf.Timestamp last_burn_time = 4;      // last qualifying ANT burn for MOA §5.3(2)
  bool is_compliant = 5;
  google.protobuf.Timestamp next_check = 6;
}
