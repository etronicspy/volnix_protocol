syntax = "proto3";

package volnix.ident.v1;

option go_package = "github.com/volnix-protocol/volnix-protocol/proto/gen/go/volnix/ident/v1;identv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "cosmos/base/v1beta1/coin.proto";

// Roles per §4.2: Citizen (Гражданин; on-chain name ROLE_GUEST), Supplier (Поставщик), Validator
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_GUEST = 1; // spec name: Citizen (unverified wallet); legacy enum identifier unchanged
  ROLE_SUPPLIER = 2;   // Поставщик — verified ANT supplier (§4.2); NOT the same as DAO voter (WRT) (§4.1)
  ROLE_VALIDATOR = 3;
}

// BurnReason — closed enum per §6.3 / Appendix A (extension = hardfork)
enum BurnReason {
  BURN_REASON_UNSPECIFIED = 0;
  BURN_REASON_PER_HEIGHT = 1;              // Validator per-height burn §5.4
  BURN_REASON_MOA_SUPPLIER = 2;            // MOA sanction on Supplier §5.3(1)
  BURN_REASON_MOA_VALIDATOR = 3;           // MOA sanction on Validator §5.3(2)
  BURN_REASON_EPOCH_SUPPLIER_RESET = 4;    // End-of-epoch supplier reset §5.5
  BURN_REASON_PROTOCOL_OTHER = 5;          // Other deterministic protocol rule
}

// RoleChangeReason — closed enum per §6.3 / Appendix A
enum RoleChangeReason {
  ROLE_CHANGE_REASON_UNSPECIFIED = 0;
  ROLE_CHANGE_REASON_ZKP_VERIFY = 1;
  ROLE_CHANGE_REASON_ROLE_CHANGE = 2;
  ROLE_CHANGE_REASON_ROLE_MIGRATION = 3;
  ROLE_CHANGE_REASON_MOA_SUPPLIER = 4;
  ROLE_CHANGE_REASON_MOA_VALIDATOR = 5;
  ROLE_CHANGE_REASON_GOVERNANCE = 6;
  ROLE_CHANGE_REASON_DEACTIVATION_OTHER = 7;
}

// ConsensusChangeReason — closed enum per §6.3 / Appendix A
enum ConsensusChangeReason {
  CONSENSUS_CHANGE_REASON_UNSPECIFIED = 0;
  CONSENSUS_CHANGE_REASON_LZN_ACTIVATED = 1;
  CONSENSUS_CHANGE_REASON_LZN_DEACTIVATED = 2;
  CONSENSUS_CHANGE_REASON_MOA_VALIDATOR = 3;
  CONSENSUS_CHANGE_REASON_GOVERNANCE = 4;
  CONSENSUS_CHANGE_REASON_SLASHING_OTHER = 5;
  CONSENSUS_CHANGE_REASON_GENESIS_INIT = 6;
}

message Params {
  // MOA windows §5.3 / §7.2 п.2-3 (DAO-tunable, code enforces min/max)
  google.protobuf.Duration moa_supplier_window = 1;   // T_g — MOA window for Suppliers
  google.protobuf.Duration moa_validator_window = 2;   // T_v — MOA window for Validators

  // Supplier capacity §4.2 / §7.2 п.9
  uint64 max_active_suppliers = 3;

  // Identity verification
  bool require_identity_verification = 4;
  string default_verification_provider = 5;

  // Fees
  cosmos.base.v1beta1.Coin verification_cost = 6;
  cosmos.base.v1beta1.Coin migration_fee = 7;
  cosmos.base.v1beta1.Coin role_change_fee = 8;
}

message VerifiedAccount {
  string address = 1;
  Role   role = 2;
  google.protobuf.Timestamp last_active = 3;
  string identity_hash = 4;
  string zkp_proof = 5;
  string verification_provider = 6;
  google.protobuf.Timestamp verification_date = 7;
  bool is_active = 8;

  // MOA tracking §5.3
  google.protobuf.Timestamp last_moa_event = 9;  // last qualifying MOA event (sell order / burn)
}

// ConsensusAccountMapping — explicit mapping §4.2, §6.1
message ConsensusAccountMapping {
  string consensus_address = 1;  // CometBFT consensus address (hex)
  string account_address = 2;    // Bech32 account address for LZN/role
  bytes  consensus_pubkey = 3;   // Ed25519 pubkey of the consensus node
}

message ZKPProof {
  string proof_hash = 1;
  string public_inputs = 2;
  string proof_data = 3;
  string verification_key = 4;
  google.protobuf.Timestamp created_at = 5;
  string provider_signature = 6;
}

message IdentityVerification {
  string address = 1;
  string verification_provider = 2;
  string verification_id = 3;
  google.protobuf.Timestamp verification_date = 4;
  string verification_hash = 5;
  bool is_verified = 6;
  string verification_metadata = 7;
}

message RoleMigration {
  string from_address = 1;
  string to_address = 2;
  Role from_role = 3;
  Role to_role = 4;
  google.protobuf.Timestamp migration_date = 5;
  string migration_hash = 6;
  string zkp_proof = 7;
  bool is_completed = 8;
}

message VerificationProvider {
  string provider_id = 1;
  string provider_name = 2;
  string provider_public_key = 3;
  bool is_accredited = 4;
  google.protobuf.Timestamp accreditation_date = 5;
  string accreditation_hash = 6;
}



