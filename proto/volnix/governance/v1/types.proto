syntax = "proto3";

package volnix.governance.v1;

option go_package = "github.com/volnix-protocol/volnix-protocol/proto/gen/go/volnix/governance/v1;governancev1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_SUBMITTED = 1;
  PROPOSAL_STATUS_VOTING = 2;
  PROPOSAL_STATUS_PASSED = 3;
  PROPOSAL_STATUS_EXECUTED = 4;
  PROPOSAL_STATUS_REJECTED = 5;
  PROPOSAL_STATUS_EXPIRED = 6;
}

enum ProposalType {
  PROPOSAL_TYPE_UNSPECIFIED = 0;
  PROPOSAL_TYPE_PARAMETER_CHANGE = 1;
  PROPOSAL_TYPE_TEXT = 2;
}

enum VoteOption {
  VOTE_OPTION_UNSPECIFIED = 0;
  VOTE_OPTION_YES = 1;
  VOTE_OPTION_NO = 2;
  VOTE_OPTION_ABSTAIN = 3;
}

// Proposal — governance proposal with WRT-weighted voting §7
message Proposal {
  uint64 proposal_id = 1;
  string proposer = 2;
  ProposalType proposal_type = 3;
  string title = 4;
  string description = 5;
  ProposalStatus status = 6;

  google.protobuf.Timestamp submit_time = 7;
  google.protobuf.Timestamp voting_start_time = 8;
  google.protobuf.Duration voting_period = 9;
  google.protobuf.Timestamp voting_end_time = 10;

  google.protobuf.Timestamp execution_time = 11;
  google.protobuf.Duration timelock_period = 12;

  string yes_votes = 13;
  string no_votes = 14;
  string abstain_votes = 15;
  string total_votes = 16;

  repeated ParameterChange parameter_changes = 17;
}

// ParameterChange — change to an operational parameter §7.2
message ParameterChange {
  string module = 1;
  string parameter = 2;
  string old_value = 3;
  string new_value = 4;
  string description = 5;
}

// Vote — WRT-weighted vote §7
message Vote {
  uint64 proposal_id = 1;
  string voter = 2;
  VoteOption option = 3;
  string voting_power = 4;       // WRT amount
  google.protobuf.Timestamp vote_time = 5;
}

// Params — governance module params
message Params {
  google.protobuf.Duration voting_period = 1;
  google.protobuf.Duration timelock_period = 2;
  string min_deposit = 3;        // WRT
  string quorum = 4;             // decimal "0.4"
  string threshold = 5;          // decimal "0.5"
}
