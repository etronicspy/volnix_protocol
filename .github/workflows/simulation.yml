name: simulation

on:
  push:
    branches: [main, develop]
    paths:
      - "simulation/**"
      - ".github/workflows/simulation.yml"
  pull_request:
    paths:
      - "simulation/**"
      - ".github/workflows/simulation.yml"
  workflow_dispatch:

jobs:
  backend:
    name: backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            simulation/backend/requirements.txt
            simulation/backend/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest + coverage
        run: pytest --cov=core --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: simulation/backend/coverage.xml
          if-no-files-found: ignore

      - name: Regenerate docs/API.md
        run: python scripts/gen_api_md.py ../docs/API.md

      - name: Regenerate docs/CANON_COVERAGE.md
        run: python scripts/gen_canon_coverage.py ../docs/CANON_COVERAGE.md

      - name: Detect stale docs (warn only)
        run: |
          if ! git diff --quiet ../docs/API.md ../docs/CANON_COVERAGE.md; then
            echo "::warning::simulation/docs/API.md or CANON_COVERAGE.md is stale — commit autogenerated files"
            git --no-pager diff --stat ../docs/API.md ../docs/CANON_COVERAGE.md || true
          fi

  frontend:
    name: frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: simulation/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: TypeScript build
        run: npm run build

  docker:
    name: docker compose build (smoke)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose build
        working-directory: simulation
        run: docker compose build
